<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Energy demand breakdown visualization for neighbourhood configurations.">
    <title>Energy Breakdown | Neighbourhood Design Interface</title>
    <link rel="stylesheet" href="css/styles.css?v=11">
</head>

<body>
    <!-- Main Content -->
    <main class="container">
        <!-- Navigation Buttons -->
        <div class="nav-buttons">
            <a id="back-step-btn" href="layer2_energy_selection.html" class="back-button">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                Back to Energy Selection
            </a>
            <a id="next-step-btn" href="layer2_pv_breakdown.html" class="next-button">
                Layer 2: PV Generation
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </a>
        </div>

        <div class="sidebar-layout">
            <aside id="sidebar" class="sidebar"></aside>

            <div id="visual-content" class="main-content">
                <!-- Header -->
                <header class="header">
                    <h1 id="neighbourhood-title">Layer 2: Energy Breakdown</h1>
                    <p>Explore the energy usage breakdown for the selected neighbourhood.</p>
                    <!-- Energy indicators row: Energy Status + EUI Scale -->
                    <div class="energy-indicators-row">
                        <div id="energy-status-container" class="energy-status-header"></div>
                        <div id="eui-scale-container" class="eui-scale-container"></div>
                    </div>
                    <!-- Task 3.4, D3.2: what the number on the left actually is.
                         Filled by js/energy.js from LMN_CONFIG. -->
                    <p id="energy-basis-note" class="energy-basis-note info-box"></p>
                </header>

                <!-- Task 3.2, D3.5: baseline, selected and change, always
                     visible together. Filled by js/energy.js. -->
                <div id="baseline-comparison" class="baseline-comparison"></div>

                <!-- Treemap Container -->
                <div id="treemap-container" class="treemap-container">
                    <!-- Treemap rectangles will be generated by energy.js -->
                </div>

                <!-- Legend -->
                <div id="legend" class="treemap-legend">
                    <!-- Legend items will be generated by energy.js -->
                </div>

                <!-- Task 3.5: assumptions and model info. Filled by
                     js/energy.js from LMN_CONFIG and the active selection. -->
                <section id="assumptions-box" class="assumptions-box"></section>
            </div>
        </div>
        <footer class="site-footer">
            <img class="footer-logo" src="Content/Images_Copyright/RHLab.png" alt="Resilient Habitat Lab Logo" style="max-height: 120px; width: auto;">
            <span class="footer-text">&copy; Resilient Habitat Lab,<br>directed by Dr. Caroline H-Vermette,<br>Concordia University</span>
            <a class="footer-doc-link" href="documentation.html#sec-modelling">Methodology: Energy modelling basis</a>
        </footer>
</main>

    <!-- Scripts -->
    <script src="js/config.js?v=11"></script>
    <script src="js/data.js?v=11"></script>
    <script src="js/sidebar.js?v=11"></script>
    <script src="js/energy.js?v=11"></script>
</body>

</html>
